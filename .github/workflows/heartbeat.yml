name: heartbeat

# The daily self-check, and the only part of the system that can notice the system itself
# stopping. The daily workflow reports on every way a run can go wrong; it cannot report a run
# that never happened - a cron GitHub dropped, a workflow disabled for inactivity, a schedule
# that stopped after an account change. Those are silent, and the first sign would be the
# channel going quiet days later.
#
# So this asks, from outside, the one question that matters: did a new video join the queue
# today? If not, the owner hears about it the same day, with what failed and what to do.
# When everything is in order it says nothing at all - an email every day that always says
# "fine" is an email nobody reads.

on:
  schedule:
    # 19:40 UTC, which is 22:40 in Kyiv: late enough that both of the daily workflow's crons
    # have had their turn even with the delays GitHub's free runners actually show (2h55 to
    # 5h44 measured), and before the 21:00 local publication of the following day.
    - cron: "40 19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write                   # the alert is an issue comment, which is what emails it

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Is the factory still feeding the channel
        id: check
        run: |
          set +e
          python scripts/heartbeat.py \
            --owner "${{ github.repository_owner }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > heartbeat.md
          echo "alert=$?" >> "$GITHUB_OUTPUT"
          cat heartbeat.md >> "$GITHUB_STEP_SUMMARY"
          cat heartbeat.md

      - name: Send it, but only when something needs doing
        if: steps.check.outputs.alert != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --label run-log --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh label create run-log --color 0e8a16 --description "One comment per daily run" 2>/dev/null || true
            number=$(gh issue create --title "Daily run log" --label run-log \
              --body "One comment per daily run, mentioning the owner so it arrives as an email. Safe to ignore." \
              | grep -o '[0-9]*$')
          fi
          gh issue comment "$number" --body-file heartbeat.md
