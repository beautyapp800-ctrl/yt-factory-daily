name: thumbnail-refresh

# Gives videos already on YouTube the bust thumbnail (scripts/refresh_thumbnails.py): every
# video still waiting for its publish time, then two already-public ones a day.
#
# It runs only after a daily run has SUCCEEDED, so the narration frames have had their Neurons
# first; a failed daily run is retried an hour later and needs what is left. It writes only
# data/thumb_refresh.json, never data/factory.db, so it cannot race the daily run's database.

# Two triggers besides a daily run finishing. When the daily run could not afford a bust the
# video is left with the older thumbnail and this puts it right once the allowance has reset
# (07:00 UTC in summer, 08:00 after the clocks go back - see core/neurons.py), which is hours
# before the video is due. Both times are listed because only one of them is after the reset
# at any time of year; the other finds nothing left to do. A scheduled run that GitHub starts
# late is harmless: the Neuron budget is worked out when it starts, with the narration frames
# of the coming run held back until they are drawn.
on:
  schedule:
    - cron: "10 7 * * *"
    - cron: "10 8 * * *"
  workflow_run:
    workflows: ["daily"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the thumbnails but do not send them to YouTube"
        type: boolean
        default: false
      only:
        description: "Only this video id (blank for the normal order)"
        type: string
        default: ""
      restore:
        description: "Put back the daily run's own thumbnail for these video ids (e.g. 22,23) instead of refreshing"
        type: string
        default: ""

concurrency:
  group: thumbnail-refresh
  cancel-in-progress: false

permissions:
  contents: write
  actions: read                   # to fetch a video's artifact for --restore

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Restore earlier thumbnails
        if: github.event_name == 'workflow_dispatch' && inputs.restore != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=""
          for id in $(echo "${{ inputs.restore }}" | tr ',' ' '); do
            run=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=video-$id"                   --jq '.artifacts | sort_by(.created_at) | last | .workflow_run.id')
            gh run download "$run" -n "video-$id" -D "restore/$id"
            args="$args --restore $id=restore/$id/thumbnail.jpg"
          done
          python scripts/refresh_thumbnails.py $args | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Refresh thumbnails
        if: github.event_name != 'workflow_dispatch' || inputs.restore == ''
        run: |
          args=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then args="$args --dry-run"; fi
          if [ -n "${{ inputs.only }}" ]; then args="$args --only ${{ inputs.only }}"; fi
          python scripts/refresh_thumbnails.py $args | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the thumbnails made
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thumbnails-${{ github.run_id }}
          path: output/_refresh/
          retention-days: 90
          if-no-files-found: ignore

      - name: Commit the ledger
        if: always()
        run: |
          [ -f data/thumb_refresh.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/thumb_refresh.json "$RUNNER_TEMP/thumb_refresh.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/thumb_refresh.json" data/thumb_refresh.json
            git add data/thumb_refresh.json
            if git diff --cached --quiet; then echo "ledger unchanged"; exit 0; fi
            git commit -m "Thumbnail refresh ${{ github.run_id }}"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 10))
          done
          echo "::error::the thumbnail ledger could not be pushed"
          exit 1
