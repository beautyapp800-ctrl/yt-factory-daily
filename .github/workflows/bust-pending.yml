name: bust-pending

# Sets the bust on a video that went up without one (scripts/bust_pending.py). The daily run
# asks for the bust first, but when Cloudflare refuses the video is still uploaded, private and
# scheduled, with no thumbnail of its own; this keeps asking every half hour until the publish
# time. A refusal costs nothing. With nothing pending a run ends in about a minute.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Draw the bust but do not send it to YouTube"
        type: boolean
        default: false

concurrency:
  group: bust-pending
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Is any video waiting for its bust
        id: check
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, sqlite3
          from datetime import datetime, timezone
          from pathlib import Path
          done = {}
          if Path("data/bust_pending.json").exists():
              done = json.loads(Path("data/bust_pending.json").read_text())["done"]
          now = datetime.now(timezone.utc).isoformat()
          c = sqlite3.connect("data/factory.db")
          rows = c.execute("SELECT id, published_at FROM videos WHERE youtube_id IS NOT NULL "
                           "AND youtube_id != ''").fetchall()
          ahead = [str(i) for i, p in rows
                   if p and p.replace("Z", "+00:00") > now and str(i) not in done]
          print(f"any={'true' if ahead else 'false'}")
          EOF

      - uses: actions/setup-python@v6
        if: steps.check.outputs.any == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - if: steps.check.outputs.any == 'true'
        run: pip install -r requirements.txt

      - name: Ask for the bust and set it
        if: steps.check.outputs.any == 'true'
        run: |
          args=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then args="--dry-run"; fi
          python scripts/bust_pending.py $args | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the busts drawn
        if: always() && steps.check.outputs.any == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bust-pending-${{ github.run_id }}
          path: output/_bust_pending/
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit the ledger
        if: always() && steps.check.outputs.any == 'true'
        run: |
          [ -f data/bust_pending.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/bust_pending.json "$RUNNER_TEMP/bust_pending.json"
          mkdir -p "$RUNNER_TEMP/busts" && cp -n assets/busts/* "$RUNNER_TEMP/busts/" 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/bust_pending.json" data/bust_pending.json
            mkdir -p assets/busts && cp -n "$RUNNER_TEMP"/busts/* assets/busts/ 2>/dev/null || true
            git add data/bust_pending.json assets/busts
            if git diff --cached --quiet; then echo "ledger unchanged"; exit 0; fi
            git commit -m "Bust pending ${{ github.run_id }}"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 10))
          done
          echo "::error::the bust ledger could not be pushed"
          exit 1
