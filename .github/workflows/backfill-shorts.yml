name: backfill-shorts

# Makes and uploads the Short for videos whose daily run lost it. By hand only:
#   gh workflow run backfill-shorts.yml -f video_ids="43 44"
on:
  workflow_dispatch:
    inputs:
      video_ids:
        description: "Video ids, separated by spaces"
        required: true

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-piper.txt
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-piper.txt
      - name: Restore what the daily run of video 43 left behind
        uses: actions/cache/restore@v4
        with:
          path: |
            output/43/images
            output/43/bust
            output/43/voice.mp3
            output/43/timings.json
            output/43/script.txt
            output/43/outline.json
            output/43/concept.json
            output/43/uploaded.json
            output/43/short_uploaded.json
            output/43/short.json
            output/43/short.mp4
          key: backfill-43-${{ github.run_id }}
          restore-keys: |
            video-43-
      - name: Restore what the daily run of video 44 left behind
        uses: actions/cache/restore@v4
        with:
          path: |
            output/44/images
            output/44/bust
            output/44/voice.mp3
            output/44/timings.json
            output/44/script.txt
            output/44/outline.json
            output/44/concept.json
            output/44/uploaded.json
            output/44/short_uploaded.json
            output/44/short.json
            output/44/short.mp4
          key: backfill-44-${{ github.run_id }}
          restore-keys: |
            video-44-
      - name: Make and upload the Shorts
        run: python scripts/backfill_shorts.py ${{ inputs.video_ids }}
      - name: Commit the database back
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/factory.db
          if git diff --cached --quiet; then echo "database unchanged"; exit 0; fi
          cp data/factory.db "$RUNNER_TEMP/factory.db"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"
            cp "$RUNNER_TEMP/factory.db" data/factory.db
            git add data/factory.db
            git diff --cached --quiet && exit 0
            git commit -m "State after Short backfill ${{ github.run_id }}"
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((attempt * 10))
          done
          exit 1
