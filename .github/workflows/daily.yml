name: daily

# One video a day: topic, script, voice, pictures, render, thumbnail, SEO, upload.
#
# The runner is thrown away afterwards and output/ is not in git, so what a run produces is
# carried over explicitly:
#   - data/factory.db is committed back after EVERY run, failed ones too. It holds the video's
#     row, scenes and the log of finished stages, which is what lets the next run resume.
#   - the files that cost money or time (pictures, narration, timings, script) go in the
#     Actions cache, keyed by video id. A run that dies at the render therefore does not pay
#     for 70 pictures twice - which on a 10,000 Neuron daily allowance it could not afford.
#
# A failed run does not stop the schedule: cron fires again tomorrow regardless, and carries on
# with the unfinished video (up to 3 attempts) before starting a new one.

on:
  schedule:
    # Two chances a day, not one. GitHub starts a scheduled job when it has runners free, not
    # when the cron says: every scheduled run of this repository so far began between 2h55 and
    # 5h44 after its time, and GitHub's own documentation says a run may be dropped entirely
    # when the load is high enough. The second cron costs nothing on the days the first worked
    # - the guard job below sees the finished video and stops - and rescues the days it did not.
    - cron: "17 1 * * *"          # 01:17 UTC. Off the hour on purpose: :00 is when everyone's cron fires.
    - cron: "43 10 * * *"         # 10:43 UTC, far enough after the first to know how it ended.
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false       # never kill a run halfway through an upload

permissions:
  contents: write                 # commit data/factory.db
  issues: write                   # the run summary is posted as an issue comment, which is the email

jobs:
  # Does this run have anything to do? Asked before the five-hour job is allowed to start, so
  # the second cron is free on the days the first one already delivered.
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.guard.outputs.run }}
      reason: ${{ steps.guard.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - id: guard
        run: python scripts/ci_should_run.py | tee -a "$GITHUB_OUTPUT"
      - run: echo "${{ steps.guard.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

  produce:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300          # 5 hours for the whole job
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # The fallback when Groq runs dry. core/llm.py skips Gemini
      # entirely when this is unset, so without it there is no fallback
      # at all - which is what the pipeline had until now.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-piper.txt

      - name: Cache apt packages (ffmpeg, tesseract)
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-ffmpeg-tesseract-v1

      - name: Install ffmpeg and tesseract
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update -qq
          sudo apt-get install -y -qq -o Dir::Cache::archives="$HOME/apt-archives" ffmpeg tesseract-ocr
          sudo chown -R "$USER" ~/apt-archives || true

      - name: Install Python dependencies
        # requirements-piper.txt is separate because edge-tts runs do not need
        # it. config.json selects piper, so it has to be installed here or the
        # preflight dies with "No module named 'piper'".
        run: |
          pip install -r requirements.txt
          pip install -r requirements-piper.txt

      - name: Cache the piper voice model
        id: voicecache
        uses: actions/cache@v4
        with:
          path: assets/voices
          key: piper-voice-en_US-ryan-high-v1

      - name: Download the piper voice model
        # assets/voices/ is gitignored, so the model is not in the checkout and
        # nothing else fetches it. Without this, piper installs fine and then
        # fails at the first sentence.
        if: steps.voicecache.outputs.cache-hit != 'true'
        run: |
          mkdir -p assets/voices
          python -m piper.download_voices --download-dir assets/voices en_US-ryan-high
          ls -la assets/voices

      - name: Preflight (secrets, tools, can edge-tts speak from here, does the YouTube token work)
        run: python scripts/ci_preflight.py

      - name: Which video is this run working on
        id: state
        run: python scripts/ci_state.py | tee -a "$GITHUB_OUTPUT"

      - name: Restore what an earlier run of this video left behind
        uses: actions/cache/restore@v4
        with:
          path: |
            output/${{ steps.state.outputs.video_id }}/images
            output/${{ steps.state.outputs.video_id }}/bust
            output/${{ steps.state.outputs.video_id }}/voice.mp3
            output/${{ steps.state.outputs.video_id }}/timings.json
            output/${{ steps.state.outputs.video_id }}/script.txt
            output/${{ steps.state.outputs.video_id }}/outline.json
            output/${{ steps.state.outputs.video_id }}/concept.json
            output/${{ steps.state.outputs.video_id }}/uploaded.json
            output/${{ steps.state.outputs.video_id }}/short_uploaded.json
            output/${{ steps.state.outputs.video_id }}/short.json
            output/${{ steps.state.outputs.video_id }}/short.mp4
          key: video-${{ steps.state.outputs.video_id }}-${{ github.run_id }}
          restore-keys: |
            video-${{ steps.state.outputs.video_id }}-

      - name: Produce and upload the video
        id: run
        continue-on-error: true   # the steps below must run either way
        run: python run.py

      - name: Save what this run produced, for the next one
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            output/${{ steps.state.outputs.video_id }}/images
            output/${{ steps.state.outputs.video_id }}/bust
            output/${{ steps.state.outputs.video_id }}/voice.mp3
            output/${{ steps.state.outputs.video_id }}/timings.json
            output/${{ steps.state.outputs.video_id }}/script.txt
            output/${{ steps.state.outputs.video_id }}/outline.json
            output/${{ steps.state.outputs.video_id }}/concept.json
            output/${{ steps.state.outputs.video_id }}/uploaded.json
            output/${{ steps.state.outputs.video_id }}/short_uploaded.json
            output/${{ steps.state.outputs.video_id }}/short.json
            output/${{ steps.state.outputs.video_id }}/short.mp4
          key: video-${{ steps.state.outputs.video_id }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build the contact sheet (how the pictures are reviewed at a glance)
        if: always()
        continue-on-error: true
        run: python scripts/contact_sheet.py ${{ steps.state.outputs.video_id }}

      - name: Keep the finished video downloadable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # The runner is thrown away and final.mp4 is too big to cache, so without this the
          # only copy is the one on YouTube, which cannot be downloaded back. 90 days is the
          # maximum retention and costs nothing on a public repository.
          name: video-${{ steps.state.outputs.video_id }}
          path: |
            output/${{ steps.state.outputs.video_id }}/final.mp4
            output/${{ steps.state.outputs.video_id }}/contact_sheet.jpg
            output/${{ steps.state.outputs.video_id }}/thumbnail.jpg
            output/${{ steps.state.outputs.video_id }}/thumb_small.jpg
            output/${{ steps.state.outputs.video_id }}/script.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Commit the database back
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p assets/busts
          git add data/factory.db assets/busts
          if git diff --cached --quiet; then
            echo "database unchanged"
            exit 0
          fi
          # The database IS the memory: which video exists, which is on YouTube. Losing
          # this push made the next run upload the same video a second time. The earlier
          # version rebased the binary file, hit a conflict, and then pushed a detached
          # head that had nothing new in it - which git reports as success. So there is
          # no rebase here: this run's copy of the file is put on top of whatever the
          # remote has now, and the push is checked by comparing what the remote holds.
          cp data/factory.db "$RUNNER_TEMP/factory.db"
          # The bust library only ever gains files (pipeline/bust_library.py), so what this run
          # drew is copied back on top without overwriting anything the remote already has.
          mkdir -p "$RUNNER_TEMP/busts" && cp -n assets/busts/* "$RUNNER_TEMP/busts/" 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            git fetch origin "${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"
            cp "$RUNNER_TEMP/factory.db" data/factory.db
            mkdir -p assets/busts && cp -n "$RUNNER_TEMP"/busts/* assets/busts/ 2>/dev/null || true
            git add data/factory.db assets/busts
            if git diff --cached --quiet; then
              echo "the remote already holds this database"
              exit 0
            fi
            git commit -m "State after run ${{ github.run_id }} (${{ steps.run.outcome }})"
            if git push origin "HEAD:${{ github.ref_name }}"; then
              git fetch origin "${{ github.ref_name }}"
              if git diff --quiet "origin/${{ github.ref_name }}" -- data/factory.db                  && cmp -s data/factory.db "$RUNNER_TEMP/factory.db"; then
                echo "database pushed and verified on attempt $attempt"
                exit 0
              fi
              echo "push reported success but the remote copy differs"
            fi
            echo "push attempt $attempt failed, retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::error::the database could not be pushed after 5 attempts; the next run would repeat finished work, so this run is failed on purpose"
          exit 1

      - name: Post the run summary (this is the email)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # "skipped" means the preflight failed and no stage ran; anything but success is a failure.
          case "${{ steps.run.outcome }}" in
            success) outcome=success ;;
            skipped|"") outcome=not-started ;;
            *) outcome=failure ;;
          esac
          python scripts/notify.py --outcome "$outcome" --owner "${{ github.repository_owner }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          number=$(gh issue list --label run-log --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh label create run-log --color 0e8a16 --description "One comment per daily run" 2>/dev/null || true
            number=$(gh issue create --title "Daily run log" --label run-log \
              --body "One comment per daily run, mentioning the owner so it arrives as an email. Safe to ignore." \
              | grep -o '[0-9]*$')
          fi
          gh issue comment "$number" --body-file summary.md

      - name: Fail the job if the run failed
        if: steps.run.outcome == 'failure'
        run: exit 1
