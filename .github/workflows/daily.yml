name: daily

# One video a day: topic, script, voice, pictures, render, thumbnail, SEO, upload.
#
# The runner is thrown away afterwards and output/ is not in git, so what a run produces is
# carried over explicitly:
#   - data/factory.db is committed back after EVERY run, failed ones too. It holds the video's
#     row, scenes and the log of finished stages, which is what lets the next run resume.
#   - the files that cost money or time (pictures, narration, timings, script) go in the
#     Actions cache, keyed by video id. A run that dies at the render therefore does not pay
#     for 70 pictures twice - which on a 10,000 Neuron daily allowance it could not afford.
#
# A failed run does not stop the schedule: cron fires again tomorrow regardless, and carries on
# with the unfinished video (up to 3 attempts) before starting a new one.

on:
  schedule:
    - cron: "17 1 * * *"          # 01:17 UTC. Off the hour on purpose: :00 is when everyone's cron fires.
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false       # never kill a run halfway through an upload

permissions:
  contents: write                 # commit data/factory.db
  issues: write                   # the run summary is posted as an issue comment, which is the email

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 300          # 5 hours for the whole job
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache apt packages (ffmpeg, tesseract)
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-ffmpeg-tesseract-v1

      - name: Install ffmpeg and tesseract
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update -qq
          sudo apt-get install -y -qq -o Dir::Cache::archives="$HOME/apt-archives" ffmpeg tesseract-ocr
          sudo chown -R "$USER" ~/apt-archives || true

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Preflight (secrets, tools, can edge-tts speak from here, does the YouTube token work)
        run: python scripts/ci_preflight.py

      - name: Which video is this run working on
        id: state
        run: python scripts/ci_state.py | tee -a "$GITHUB_OUTPUT"

      - name: Restore what an earlier run of this video left behind
        uses: actions/cache/restore@v4
        with:
          path: |
            output/${{ steps.state.outputs.video_id }}/images
            output/${{ steps.state.outputs.video_id }}/voice.mp3
            output/${{ steps.state.outputs.video_id }}/timings.json
            output/${{ steps.state.outputs.video_id }}/script.txt
            output/${{ steps.state.outputs.video_id }}/outline.json
            output/${{ steps.state.outputs.video_id }}/concept.json
          key: video-${{ steps.state.outputs.video_id }}-${{ github.run_id }}
          restore-keys: |
            video-${{ steps.state.outputs.video_id }}-

      - name: Produce and upload the video
        id: run
        continue-on-error: true   # the steps below must run either way
        run: python run.py

      - name: Save what this run produced, for the next one
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            output/${{ steps.state.outputs.video_id }}/images
            output/${{ steps.state.outputs.video_id }}/voice.mp3
            output/${{ steps.state.outputs.video_id }}/timings.json
            output/${{ steps.state.outputs.video_id }}/script.txt
            output/${{ steps.state.outputs.video_id }}/outline.json
            output/${{ steps.state.outputs.video_id }}/concept.json
          key: video-${{ steps.state.outputs.video_id }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build the contact sheet (how the pictures are reviewed at a glance)
        if: always()
        continue-on-error: true
        run: python scripts/contact_sheet.py ${{ steps.state.outputs.video_id }}

      - name: Keep the finished video downloadable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # The runner is thrown away and final.mp4 is too big to cache, so without this the
          # only copy is the one on YouTube, which cannot be downloaded back. 90 days is the
          # maximum retention and costs nothing on a public repository.
          name: video-${{ steps.state.outputs.video_id }}
          path: |
            output/${{ steps.state.outputs.video_id }}/final.mp4
            output/${{ steps.state.outputs.video_id }}/contact_sheet.jpg
            output/${{ steps.state.outputs.video_id }}/thumbnail.jpg
            output/${{ steps.state.outputs.video_id }}/thumb_small.jpg
            output/${{ steps.state.outputs.video_id }}/script.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Commit the database back
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/factory.db
          if git diff --cached --quiet; then
            echo "database unchanged"
          else
            git commit -m "State after run ${{ github.run_id }} (${{ steps.run.outcome }})"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Post the run summary (this is the email)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # "skipped" means the preflight failed and no stage ran; anything but success is a failure.
          case "${{ steps.run.outcome }}" in
            success) outcome=success ;;
            skipped|"") outcome=not-started ;;
            *) outcome=failure ;;
          esac
          python scripts/notify.py --outcome "$outcome" --owner "${{ github.repository_owner }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          number=$(gh issue list --label run-log --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh label create run-log --color 0e8a16 --description "One comment per daily run" 2>/dev/null || true
            number=$(gh issue create --title "Daily run log" --label run-log \
              --body "One comment per daily run, mentioning the owner so it arrives as an email. Safe to ignore." \
              | grep -o '[0-9]*$')
          fi
          gh issue comment "$number" --body-file summary.md

      - name: Fail the job if the run failed
        if: steps.run.outcome == 'failure'
        run: exit 1
